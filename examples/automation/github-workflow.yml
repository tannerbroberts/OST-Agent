# Scheduled, unattended OST maintenance pass — Claude Code as the brain.
#
# Copy this into YOUR VAULT repository as `.github/workflows/ost-discovery.yml`.
# It runs a full /ost-pass on a schedule and commits + pushes any new nodes.
#
# One-time setup in the vault repo:
#   1. Generate a Claude Code token locally:  claude setup-token
#   2. Save it as the repo secret CLAUDE_CODE_OAUTH_TOKEN
#      (Settings → Secrets and variables → Actions → New repository secret).
#
# Auth note: Claude Code headless uses your Claude subscription via the OAuth token
# above — no ANTHROPIC_API_KEY required. (If you'd rather bill the Anthropic API,
# set ANTHROPIC_API_KEY instead and drop the OAuth token.)
name: OST discovery pass

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours; tune to your discovery cadence
  workflow_dispatch: {} # allow manual runs

permissions:
  contents: write # commit + push new/updated OST nodes

concurrency:
  group: ost-discovery
  cancel-in-progress: false

jobs:
  ost-pass:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the vault
        uses: actions/checkout@v4

      - name: Check out OST-Agent (skill + commands + MCP server)
        uses: actions/checkout@v4
        with:
          repository: tannerbroberts/OST-Agent
          path: .ost-agent-src # ephemeral on the runner; never committed to the vault

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run a maintenance pass
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        # --allowedTools is kept in sync with .claude/commands/ost-pass.md's
        # `allowed-tools` frontmatter — that file is the authority on what /ost-pass
        # needs. If it grants a new tool, add it here too.
        #
        # --disallowedTools is the ceiling: every built-in that can write a file, run
        # a command, delegate, or reach the network. The checkout above IS the vault,
        # so without this an ordinary Write edits a node in place and the append-only
        # guarantee is gone (readiness criterion W5). There is deliberately no
        # --permission-mode: `acceptEdits` pre-approved exactly those writes.
        #
        # The MCP server is declared here rather than loaded with `--plugin-dir`, and
        # the pass instructions are handed over as the prompt rather than invoked as
        # `/ost-pass`. The plugin form ran, exited 0, and did nothing — Claude Code
        # answered `Unknown command: /ost-pass` with neither the command nor the server
        # present, so the surface --allowedTools describes was never there to allow. A
        # pass with no tools cannot fail loudly; it has nothing to fail at. See the
        # header of autonomous-pass.sh, where the same substitution is made and where a
        # health record caught it. --strict-mcp-config keeps any ambient server
        # configuration out of an unattended pass.
        run: |
          SRC="$GITHUB_WORKSPACE/.ost-agent-src"
          cat >"$RUNNER_TEMP/ost-mcp.json" <<JSON
          {"mcpServers":{"ost-agent":{"command":"node","args":["$SRC/dist/ost-agent.mjs","mcp","--vault","$PWD"]}}}
          JSON
          claude -p "$(awk 'BEGIN{n=0} /^---$/{n++; next} n>=2' "$SRC/.claude/commands/ost-pass.md")" \
            --append-system-prompt "$(cat "$SRC/.claude/skills/opportunity-solution-tree/SKILL.md")" \
            --mcp-config "$RUNNER_TEMP/ost-mcp.json" \
            --strict-mcp-config \
            --allowedTools "mcp__ost-agent__ost_ingest_inbox,mcp__ost-agent__ost_next_work,mcp__ost-agent__ost_read_tree,mcp__ost-agent__ost_create_node,mcp__ost-agent__ost_link_nodes,mcp__ost-agent__ost_append_to_node,mcp__ost-agent__ost_set_status,mcp__ost-agent__ost_set_evidence,mcp__ost-agent__ost_annotate" \
            --disallowedTools "Bash,BashOutput,KillShell,Edit,MultiEdit,Write,NotebookEdit,Task,SlashCommand,WebFetch,WebSearch" \
            --output-format text

      - name: Push new nodes
        run: |
          git config user.name  "ost-agent[bot]"
          git config user.email "ost-agent@users.noreply.github.com"
          git push
