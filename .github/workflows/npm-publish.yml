# Publish ost-agent to npm when a GitHub Release is published.
#
# One-time setup:
#   1. Create an npm automation token (npmjs.com → Access Tokens → Automation).
#   2. Add it as the repo secret NPM_TOKEN (Settings → Secrets → Actions).
#
# Release flow: bump the version (see RELEASING.md), push a tag — the tag push
# alone publishes. Publishing a GitHub Release for the tag also triggers it; a
# version-already-published guard makes the double-trigger harmless. Either way
# this workflow builds, tests, and publishes with npm provenance (a signed link
# from the published package back to this workflow run).
name: Publish to npm

on:
  push:
    tags: ["v*"] # the autonomous loop publishes by pushing a version tag
  release:
    types: [published]
  workflow_dispatch: {} # manual re-run if a release publish failed

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci

      # Tag push and release publish can both fire for the same version; only
      # the first one may publish.
      - name: Skip if this version is already on npm
        id: guard
        run: |
          V=$(node -p "require('./package.json').version")
          if [ "$(npm view "ost-agent@$V" version 2>/dev/null)" = "$V" ]; then
            echo "ost-agent@$V is already published — skipping"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      # prepublishOnly (npm run build && npm run test) gates the publish, and
      # publishConfig.provenance + id-token:write produce a provenance attestation.
      - run: npm publish
        if: steps.guard.outputs.published != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
