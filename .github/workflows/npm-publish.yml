# Publish ost-agent to npm when a GitHub Release is published.
#
# One-time setup:
#   1. Create an npm automation token (npmjs.com → Access Tokens → Automation).
#   2. Add it as the repo secret NPM_TOKEN (Settings → Secrets → Actions).
#
# Release flow: bump the version (see RELEASING.md), push a tag, publish a GitHub
# Release for that tag — this workflow builds, tests, and publishes with npm
# provenance (a signed link from the published package back to this workflow run).
name: Publish to npm

on:
  release:
    types: [published]
  # A pushed tag publishes on its own. Added after four releases (0.10–0.13)
  # were cut, tagged and never published: the only trigger was a GitHub Release,
  # which is a manual step an unattended pass cannot take.
  push:
    tags: ["v*"]
  # The path that actually worked when both of the above were unavailable —
  # some environments refuse a tag push outright (HTTP 403 at the git proxy),
  # which takes the tag trigger and the Release-for-a-tag trigger with it.
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci

      # Three triggers can describe the same release — tagging v1.2.3 and then
      # publishing a Release for that tag fires twice. The second run would fail
      # on npm's duplicate-version error, which reads like a broken release when
      # it means the opposite. Skip instead, and say so.
      - id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "ost-agent@$VERSION" version >/dev/null 2>&1; then
            echo "ost-agent@$VERSION is already on the registry — nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # prepublishOnly (npm run build && npm run test) gates the publish, and
      # publishConfig.provenance + id-token:write produce a provenance attestation.
      - if: steps.check.outputs.publish == 'true'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
