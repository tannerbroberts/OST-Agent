name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # A job with no timeout inherits GitHub's 6-hour ceiling. This suite spawns
    # git and tsx subprocesses per test, and it has wedged twice — runs
    # 30365354275 and 30388964758 both sat in `npm test` indefinitely, the first
    # for over three hours. The cost of a wedge is not just runner minutes: a job
    # that never finishes never publishes its log, so the one artifact needed to
    # diagnose it is exactly what a hang withholds. Ten minutes is ~50x the
    # suite's real runtime, so this bounds a hang without failing a slow runner.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The default is a depth-1 checkout, and one test's SUBJECT is this
          # repository's committed record: `test/product/committed-capability-profile.test.ts`
          # takes a census over the last 100 commits and 30 pull requests to decide
          # whether a capability profile can be inferred from them at all. Under
          # depth 1 it read a record of one commit — the check that exists to say
          # whether the history is legible could not see the history. It fails
          # loudly rather than reporting a clean run on an empty subject (see
          # `CapabilityProfileReport.shallow`), which is why the fix is here and
          # not a skip in the test.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      # Report anything still holding the event loop open when the run ends.
      # If this wedges again, the log names the handle instead of leaving a
      # silent timeout to be guessed at.
      - run: npm test -- --reporter=default --reporter=hanging-process

  bundle-drift:
    timeout-minutes: 10
    # The plugin launches a committed artifact. If it can drift from source,
    # what users run is whatever was last remembered to be rebuilt — so this
    # job is the control that makes committing it safe.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # "bundle" (package.json) invokes esbuild with a --banner:js that installs
      # a real `require` via node:module's createRequire. Without it, commander's
      # own `require("node:events")` etc. (called at its module top level) hits
      # esbuild's CJS-in-ESM shim, which throws under pure ESM output because
      # there is no ambient `require` for it to find — see test/release/bundle.test.ts
      # for the full explanation and a test that exercises real tool handlers
      # against the built bundle, not just its module graph.
      - run: npm run bundle
      # "bundle" also regenerates dist/capability-manifest.json from the artefact
      # it just built, so both committed files are checked here. A stale manifest
      # is a published capability list that no longer describes what ships.
      - name: Fail if the committed bundle or manifest is stale
        run: |
          if ! git diff --exit-code dist/ost-agent.mjs dist/capability-manifest.json; then
            echo "::error::dist/ is stale. Run 'npm run bundle' and commit the result."
            exit 1
          fi
